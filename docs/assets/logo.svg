<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="typed-kalman logo">
  <title>typed-kalman</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3b73"/>
      <stop offset="1" stop-color="#2e6bd9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6a54a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f6a54a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="132" height="132" rx="28" fill="url(#bg)"/>
  <!-- Estimated track -->
  <path d="M22 104 C 46 96, 58 74, 72 66 S 104 42, 120 30" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- Noisy measurements around it -->
  <g fill="#9cc3ff">
    <circle cx="30" cy="92" r="4"/>
    <circle cx="44" cy="104" r="4"/>
    <circle cx="56" cy="80" r="4"/>
    <circle cx="86" cy="64" r="4"/>
    <circle cx="98" cy="40" r="4"/>
    <circle cx="112" cy="46" r="4"/>
  </g>
  <!-- Current estimate with its covariance ellipse -->
  <circle cx="72" cy="66" r="26" fill="url(#glow)"/>
  <ellipse cx="72" cy="66" rx="22" ry="12" transform="rotate(-32 72 66)" fill="none" stroke="#f6a54a" stroke-width="3.5"/>
  <circle cx="72" cy="66" r="6" fill="#f6a54a" stroke="#ffffff" stroke-width="2"/>
</svg>
