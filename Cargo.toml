[package]
name = "typed-kalman"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Type-safe, no_std Kalman filters: KF, EKF, UKF and smoothers"
categories = ["mathematics", "science::robotics", "embedded", "no-std"]
keywords = ["kalman", "filter", "ukf", "ekf", "no-std"]
readme = "README.md"
documentation = "https://docs.rs/typed-kalman"
# Benchmark data and tooling stay in the repo; the scenario files alone exceed crates.io's limit.
exclude = [
    "tests/vectors/", "bench/", "results/", "scripts/", "docs/", "CLAUDE.md",
    "kalman-rust-repo-guide.md",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
std = ["nalgebra/std"]
autodiff = []

[dependencies]
nalgebra = { version = "0.35", default-features = false, features = ["libm"] }

[dev-dependencies]
approx = "0.5"
proptest = "1"
criterion = "0.8"
trybuild = "1"
adskalman = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "filters"
harness = false

[[bench]]
name = "compare"
harness = false

# The stability tests run a million filter steps; unoptimized nalgebra makes that take minutes.
# Debug assertions and overflow checks stay on.
[profile.test]
opt-level = 3

[[example]]
name = "imu_attitude"
required-features = ["autodiff"]
